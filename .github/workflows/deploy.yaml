name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

  test-and-coverage:
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: |
          set -o pipefail
          npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage 2>&1 | tee test-output.log
          echo "::group::Coverage Summary"
          grep -A 6 "Coverage summary" test-output.log || echo "Coverage summary not found"
          echo "::endgroup::"

          # Calculate line coverage from Istanbul's lcov output, independent of console formatting.
          LCOV_FILE=$(find coverage -name lcov.info -print -quit)
          if [ -z "$LCOV_FILE" ]; then
            echo "::error::Coverage report not found"
            exit 1
          fi
          LINES_COVERAGE=$(awk -F: '/^LF:/ { found += $2 } /^LH:/ { hit += $2 } END { if (found > 0) printf "%.2f", 100 * hit / found; else exit 1 }' "$LCOV_FILE")
          echo "Lines Coverage: $LINES_COVERAGE%"
          echo "lines-coverage=$LINES_COVERAGE%" >> $GITHUB_ENV

          # Check if coverage is above 50%
          if (( $(echo "$LINES_COVERAGE >= 50" | bc -l) )); then
            echo "✅ Coverage check passed: $LINES_COVERAGE% (above 50%)"
          else
            echo "❌ Coverage check failed: $LINES_COVERAGE% (below 50%)"
            echo "::error::Lines coverage ($LINES_COVERAGE%) is below the required 50% threshold"
            exit 1
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: [code-quality, test-and-coverage]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry (PAT)
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: List environment files
        run: |
          ls ./src/environments

      - name: Generate environment.prod.ts from template
        run: |
          #export API_URL="${{ vars.BACKEND_URL }}"
          #export LLM_PROCESSOR_URL="${{ vars.LLM_PROCESSOR_URL }}"
          export API_URL=""
          export LLM_PROCESSOR_URL=""
          export LLM_PROCESSOR_TOKEN="${{ secrets.LLM_PROCESSOR_TOKEN }}"
          envsubst < src/environments/environment.prod.template.ts > src/environments/environment.prod.ts
        working-directory: ./

      - name: Build and Push Frontend image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          docker build -t "ghcr.io/$owner/finance-app-frontend:$IMAGE_TAG" -f ./Frontend.Dockerfile ./
          docker push "ghcr.io/$owner/finance-app-frontend:$IMAGE_TAG"

      - name: Trigger Infrastructure Deployment
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          gh workflow run deploy.yml \
            -R Sziszka90/FinanceApp.Infrastructure.Azure \
            --ref main \
            -f frontendImageTag="$IMAGE_TAG"
