<main class="main-container groups-page">
  <header class="page-heading">
    <div>
      <p class="page-eyebrow">ORGANIZE YOUR FINANCES</p>
      <h1>Transaction groups</h1>
      <p class="page-description">Create categories that make your spending easier to understand.</p>
    </div>
    <button class="custom-button" [disabled]="loading()" (click)="createTransactionGroup()"><span class="material-icons" aria-hidden="true">add</span> Create group</button>
  </header>
@if (loading()) {
  <loader></loader>
}
@if (!loading()) {
  <div class="table-container">
    @if (dataSource().data.length > 0) {
      <div>
        <table mat-table [dataSource]="dataSource()" class="mat-elevation-z8">
          <ng-container class="column" matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let element"> {{element.name}} </td>
          </ng-container>
          <ng-container class="column" matColumnDef="description">
              <th mat-header-cell *matHeaderCellDef>Description</th>
              <td mat-cell *matCellDef="let element"> {{element.description}} </td>
          </ng-container>
          <ng-container class="column" matColumnDef="icon">
              <th mat-header-cell *matHeaderCellDef>Icon</th>
              <td mat-cell *matCellDef="let element"><i class="{{element.groupIcon}}"></i></td>
          </ng-container>
          <ng-container class="column" matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Actions</th>
              <td mat-cell *matCellDef="let row">
              <div class="action-button-container">
                <button class="custom-small-button bounce-button" [disabled]="loading()" (click)="deleteTransactionGroup(row)">
                  <mat-icon>delete</mat-icon>
                </button>
                <button class="custom-small-button bounce-button" [disabled]="loading()" (click)="editTransactionGroup(row)">
                  <mat-icon>edit</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumnsFull"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumnsFull;"></tr>
        </table>
      </div>
    } @else {
      <div class="default-font no-transaction-groups">
        No transaction groups found.
      </div>
    }
  </div>
}

</main>
